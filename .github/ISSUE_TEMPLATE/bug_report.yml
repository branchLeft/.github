name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Package version, or commit SHA if running from source
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Found a security vulnerability? Please don't file it here — see [SECURITY.md](https://github.com/branchLeft/.github/blob/main/SECURITY.md) instead.
